            { q: "อาการ \"Burnout\" ในที่ทำงานหมายถึงอะไร", options: ["ไฟไหม้ที่ทำงาน", "ภาวะหมดไฟในการทำงาน เหนื่อยหน่าย หมดแรงจูงใจ", "การทำงานหนักเกินไปจนรวย", "การถูกไล่ออก"], a: 1 },
            { q: "IQ (Intelligence Quotient) วัดความฉลาดด้านใด", options: ["อารมณ์", "สติปัญญา การคิดวิเคราะห์ ตรรกะ", "ศีลธรรม", "ร่างกาย"], a: 1 },
            { q: "AQ (Adversity Quotient) หมายถึงความฉลาดด้านใด", options: ["ความฉลาดในการเล่นเกม", "ความฉลาดในการรับมือกับปัญหาและอุปสรรค", "ความฉลาดทางสังคม", "ความฉลาดทางดิจิทัล"], a: 1 },
            { q: "ความเครียดแบบ \"Eustress\" คืออะไร", options: ["ความเครียดที่เป็นโทษ", "ความเครียดที่ดี (ความเครียดในระดับพอดี)", "ความเครียดจากการสอบตก", "ความเครียดจากการตกงาน"], a: 1 },
            { q: "บุคคลที่มีความ \"ยืดหยุ่น\" (Resilience) ทางจิตใจ มีลักษณะอย่างไร", options: ["ล้มแล้วลุกได้เร็ว ฟื้นตัวจากความผิดหวังได้ไว", "ร่างกายอ่อนตัว", "เปลี่ยนใจง่าย", "ไม่มีจุดยืน"], a: 0 },
            { q: "Mindfulness หมายถึงอะไร", options: ["การเหม่อลอย", "การมีสติรู้ตัว อยู่กับปัจจุบัน", "การคิดฟุ้งซ่าน", "การนอนหลับ"], a: 1 },
            { q: "หากเกิดความขัดแย้งในที่ทำงาน การใช้ \"I Message\" มีประโยชน์อย่างไร", options: ["เป็นการบอกความรู้สึกของ \"ฉัน\" โดยไม่ตำหนิอีกฝ่าย", "เป็นการสั่งให้คนอื่นทำตาม", "เป็นการด่ากราด", "เป็นการยกยอตัวเอง"], a: 0 },
            { q: "การ \"ให้อภัย\" (Forgiveness) มีผลดีต่อใครมากที่สุด", options: ["คนที่ทำผิด", "ตัวเราเอง (ปลดปล่อยความทุกข์ใจ)", "ตำรวจ", "ศาล"], a: 1 },
            { q: "Maslow กล่าวว่า ความต้องการขั้นสูงสุดของมนุษย์จะเกิดขึ้นได้เมื่อใด", options: ["เมื่อรวยล้นฟ้า", "เมื่อความต้องการขั้นพื้นฐานได้รับการตอบสนองแล้ว", "เมื่อเกิดมา", "ไม่สามารถเกิดขึ้นได้จริง"], a: 1 },
            { q: "บุคลิกภาพแบบ \"Type A\" (ใจร้อน, แข่งขัน, เร่งรีบ) เสี่ยงต่อโรคใด", options: ["โรคกระเพาะ", "โรคหัวใจ", "โรคหวัด", "โรคผิวหนัง"], a: 1 },
            { q: "\"ใจเขาใจเรา\" ตรงกับหลักธรรมข้อใด", options: ["สังคหวัตถุ 4", "อริยสัจ 4", "พรหมวิหาร 4 (เมตตา กรุณา มุทิตา อุเบกขา)", "อิทธิบาท 4"], a: 2 },
            { q: "วิธีระบายความเครียดที่ ไม่เหมาะสม", options: ["ออกกำลังกาย", "พูดคุยกับเพื่อนสนิท", "ดื่มแอลกอฮอล์หรือสูบบุหรี่จัด", "ดูหนังฟังเพลง"], a: 2 },
            { q: "\"Self-Esteem\" หมายถึงอะไร", options: ["ความเห็นแก่ตัว", "การเห็นคุณค่าในตนเอง / ความภูมิใจในตนเอง", "การดูถูกคนอื่น", "การมั่นใจเกินเหตุ"], a: 1 },
            { q: "\"จิตวิทยาเชิงบวก\" (Positive Psychology) เน้นเรื่องใด", options: ["การรักษาโรคจิต", "การส่งเสริมจุดแข็งและความสุขของมนุษย์", "การสะกดจิต", "การวิเคราะห์ความฝัน"], a: 1 }
        ];

        // --- COMPONENTS ---
        const Icons = {
            Clock: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            Book: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>,
            Eye: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="green" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>,
            X: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="red" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            Home: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        };

        const MenuScreen = ({ onStart }) => (
            <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-900 to-purple-800 p-4">
                <div className="bg-white rounded-3xl shadow-2xl overflow-hidden max-w-4xl w-full flex flex-col md:flex-row">
                    <div className="flex-1 p-10 flex flex-col items-center text-center border-b md:border-b-0 md:border-r border-gray-100 bg-white hover:bg-red-50 transition-colors group cursor-pointer" onClick={() => onStart('exam')}>
                        <div className="w-24 h-24 bg-red-100 rounded-full flex items-center justify-center mb-6 text-red-600 group-hover:scale-110 transition-transform shadow-sm">
                            <Icons.Clock />
                        </div>
                        <h2 className="text-3xl font-bold text-gray-800 mb-2">โหมดสอบจริง</h2>
                        <p className="text-gray-500 mb-6 text-sm">Simulator เหมือนจริง</p>
                        <ul className="text-gray-600 text-left space-y-3 mb-8 text-sm bg-gray-50 p-4 rounded-xl w-full">
                            <li className="flex items-center gap-2"><span className="w-2 h-2 bg-red-500 rounded-full"></span>จับเวลา 90 นาที</li>
                            <li className="flex items-center gap-2"><span className="w-2 h-2 bg-red-500 rounded-full"></span>สุ่ม {EXAM_CONFIG.totalQuestionsInExam} ข้อ จากคลัง</li>
                            <li className="flex items-center gap-2"><span className="w-2 h-2 bg-red-500 rounded-full"></span>ส่งคำตอบเพื่อดูคะแนน</li>
                        </ul>
                        <button className="mt-auto px-8 py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl font-bold text-lg shadow-lg w-full transition-transform hover:-translate-y-1">เริ่มสอบ</button>
                    </div>
                    <div className="flex-1 p-10 flex flex-col items-center text-center bg-white hover:bg-green-50 transition-colors group cursor-pointer" onClick={() => onStart('practice')}>
                        <div className="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mb-6 text-green-600 group-hover:scale-110 transition-transform shadow-sm">
                            <Icons.Book />
                        </div>
                        <h2 className="text-3xl font-bold text-gray-800 mb-2">โหมดฝึกฝน</h2>
                         <p className="text-gray-500 mb-6 text-sm">เรียนรู้และทบทวน</p>
                         <ul className="text-gray-600 text-left space-y-3 mb-8 text-sm bg-gray-50 p-4 rounded-xl w-full">
                            <li className="flex items-center gap-2"><span className="w-2 h-2 bg-green-500 rounded-full"></span>ทำทุกข้อในคลัง ({QUESTION_POOL.length} ข้อ)</li>
                            <li className="flex items-center gap-2"><span className="w-2 h-2 bg-green-500 rounded-full"></span>ไม่จับเวลา</li>
                            <li className="flex items-center gap-2"><span className="w-2 h-2 bg-green-500 rounded-full"></span>กดดูเฉลยได้ทันที</li>
                        </ul>
                        <button className="mt-auto px-8 py-3 bg-green-600 hover:bg-green-700 text-white rounded-xl font-bold text-lg shadow-lg w-full transition-transform hover:-translate-y-1">เริ่มฝึกฝน</button>
                    </div>
                </div>
            </div>
        );

        const ExamInterface = ({ mode, questions, onFinish, onHome }) => {
            const [userAnswers, setUserAnswers] = useState({});
            const [timeLeft, setTimeLeft] = useState(EXAM_CONFIG.duration);
            const timerRef = useRef(null);

            const isExamMode = mode === 'exam';

            useEffect(() => {
                if (isExamMode) {
                    timerRef.current = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                clearInterval(timerRef.current);
                                onFinish(userAnswers, true);
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(timerRef.current);
            }, [isExamMode, onFinish, userAnswers]);

            // Format Time
            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m}:${s < 10 ? '0' : ''}${s}`;
            };

            const progress = (Object.keys(userAnswers).length / questions.length) * 100;

            return (
                <div className={`min-h-screen pb-20 bg-gray-50 ${isExamMode ? 'no-select' : ''}`}>
                    {/* Header */}
                    <header className={`${isExamMode ? 'bg-indigo-800' : 'bg-teal-700'} text-white sticky top-0 z-50 shadow-lg transition-colors`}>
                        <div className="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center gap-4">
                                <button onClick={onHome} className="p-2 bg-white/10 hover:bg-white/20 rounded-full transition-colors"><Icons.Home/></button>
                                <div>
                                    <h1 className="font-bold text-lg leading-tight">{isExamMode ? 'สอบปลายภาค GEN1202' : 'ฝึกฝน GEN1202'}</h1>
                                    <p className="text-xs opacity-80 font-light">{isExamMode ? 'กำลังจับเวลา' : 'แบบฝึกหัดทบทวน'}</p>
                                </div>
                            </div>
                            
                            {isExamMode && (
                                <div className={`flex items-center gap-2 font-mono text-xl font-bold px-4 py-2 rounded-lg ${timeLeft < 300 ? 'bg-red-500 animate-pulse' : 'bg-black/20'}`}>
                                    <Icons.Clock /> {formatTime(timeLeft)}
                                </div>
                            )}

                            <div className="flex items-center gap-3">
                                <div className="hidden md:block text-right text-xs mr-2">
                                    <p>ทำไปแล้ว</p>
                                    <p className="font-bold">{Object.keys(userAnswers).length} / {questions.length}</p>
                                </div>
                                <button 
                                    onClick={() => {
                                        if(!isExamMode || window.confirm('ยืนยันที่จะส่งคำตอบ?')) onFinish(userAnswers, false);
                                    }}
                                    className="bg-white text-indigo-900 hover:bg-gray-100 px-6 py-2 rounded-full text-sm font-bold shadow transition-transform active:scale-95"
                                >
                                    {isExamMode ? 'ส่งข้อสอบ' : 'สรุปผล'}
                                </button>
                            </div>
                        </div>
                        {/* Progress Bar */}
                        <div className="h-1.5 bg-black/20 w-full">
                            <div className="h-full bg-yellow-400 transition-all duration-500" style={{width: `${progress}%`}}></div>
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
                        {questions.map((q, idx) => (
                            <div key={idx} className="bg-white rounded-xl shadow-sm border border-gray-200 p-6 transition-shadow hover:shadow-md">
                                <div className="flex gap-4">
                                    <div className="flex-shrink-0 w-8 h-8 bg-gray-100 text-gray-500 rounded-full flex items-center justify-center font-bold text-sm">
                                        {idx + 1}
                                    </div>
                                    <div className="flex-grow">
                                        <h3 className="text-lg font-medium text-gray-800 mb-4 leading-relaxed">{q.q}</h3>
                                        
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                            {q.options.map((opt, optIdx) => (
                                                <button
                                                    key={optIdx}
                                                    onClick={() => setUserAnswers(prev => ({...prev, [idx]: optIdx}))}
                                                    className={`p-3 text-left rounded-lg border transition-all relative ${
                                                        userAnswers[idx] === optIdx 
                                                            ? 'border-indigo-500 bg-indigo-50 text-indigo-900 font-medium shadow-sm ring-1 ring-indigo-500' 
                                                            : 'border-gray-200 hover:border-gray-300 hover:bg-gray-50'
                                                    }`}
                                                >
                                                    <span className="mr-2 opacity-60 font-bold">{['ก', 'ข', 'ค', 'ง'][optIdx]}.</span>
                                                    {opt}
                                                    {userAnswers[idx] === optIdx && <div className="absolute right-3 top-3 text-indigo-500"><Icons.Check/></div>}
                                                </button>
                                            ))}
                                        </div>

                                        {/* เฉลยสำหรับโหมดฝึกฝน */}
                                        {!isExamMode && (
                                            <PracticeAnswerReveal answer={q.a} options={q.options} />
                                        )}
                                    </div>
                                </div>
                            </div>
                        ))}
                    </main>
                </div>
            );
        };

        const PracticeAnswerReveal = ({ answer, options }) => {
            const [show, setShow] = useState(false);
            return (
                <div className="mt-4 pt-3 border-t border-dashed border-gray-200">
                    <button onClick={() => setShow(!show)} className="text-sm text-teal-600 hover:text-teal-800 font-bold flex items-center gap-1 transition-colors">
                        <Icons.Eye /> {show ? 'ซ่อนเฉลย' : 'ดูเฉลย'}
                    </button>
                    {show && (
                        <div className="mt-2 p-3 bg-green-50 border border-green-200 rounded-lg text-green-800 animate-in fade-in slide-in-from-top-1 text-sm">
                            <span className="font-bold">คำตอบที่ถูกต้อง:</span> ข้อ {['ก', 'ข', 'ค', 'ง'][answer]} ({options[answer]})
                        </div>
                    )}
                </div>
            );
        };

        const ResultScreen = ({ questions, userAnswers, onRestart }) => {
            const score = questions.reduce((acc, q, idx) => acc + (userAnswers[idx] === q.a ? 1 : 0), 0);
            const percentage = Math.round((score / questions.length) * 100);
            
            let feedback = "";
            let colorClass = "";
            if (percentage >= 80) { feedback = "ยอดเยี่ยม! (A)"; colorClass = "text-green-600"; }
            else if (percentage >= 60) { feedback = "ผ่านเกณฑ์ (C+)"; colorClass = "text-yellow-600"; }
            else { feedback = "พยายามอีกนิดนะ (F)"; colorClass = "text-red-600"; }

            return (
                <div className="min-h-screen bg-gray-100 p-4 md:p-8">
                    <div className="max-w-4xl mx-auto">
                        <div className="bg-white rounded-3xl shadow-xl overflow-hidden mb-8">
                            <div className="bg-indigo-900 text-white p-8 text-center relative overflow-hidden">
                                <div className="relative z-10">
                                    <h2 className="text-3xl font-bold mb-2">สรุปผลการทดสอบ</h2>
                                    <p className="opacity-80">คะแนนของคุณ</p>
                                    <div className="text-6xl font-bold my-4">{score} <span className="text-2xl font-normal opacity-60">/ {questions.length}</span></div>
                                    <div className={`inline-block px-4 py-1 rounded-full bg-white font-bold text-lg ${colorClass}`}>{feedback} ({percentage}%)</div>
                                </div>
                            </div>
                            <div className="p-6 bg-gray-50 flex justify-center">
                                <button onClick={onRestart} className="px-8 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold shadow-lg transition-transform hover:-translate-y-1">กลับสู่หน้าหลัก / สอบใหม่</button>
                            </div>
                        </div>

                        <div className="space-y-6">
                            <h3 className="text-xl font-bold text-gray-700 ml-2">เฉลยละเอียด</h3>
                            {questions.map((q, idx) => {
                                const uAns = userAnswers[idx];
                                const isCorrect = uAns === q.a;
                                return (
                                    <div key={idx} className={`bg-white rounded-xl shadow-sm border-l-8 p-6 ${isCorrect ? 'border-green-500' : 'border-red-500'}`}>
                                        <div className="flex gap-3 mb-3">
                                            <span className={`flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-white font-bold ${isCorrect ? 'bg-green-500' : 'bg-red-500'}`}>
                                                {isCorrect ? <Icons.Check /> : <Icons.X />}
                                            </span>
                                            <h4 className="text-lg font-medium text-gray-800">{q.q}</h4>
                                        </div>
                                        
                                        <div className="ml-11 space-y-2">
                                            <div className="flex items-center gap-2 text-sm">
                                                <span className="text-gray-500 min-w-[60px]">คุณตอบ:</span>
                                                <span className={`font-bold ${isCorrect ? 'text-green-600' : 'text-red-600'}`}>
                                                    {uAns !== undefined ? `${['ก', 'ข', 'ค', 'ง'][uAns]}. ${q.options[uAns]}` : 'ไม่ได้ตอบ'}
                                                </span>
                                            </div>
                                            {!isCorrect && (
                                                <div className="flex items-center gap-2 text-sm bg-green-50 p-2 rounded-lg border border-green-100">
                                                    <span className="text-green-700 font-bold min-w-[60px]">เฉลย:</span>
                                                    <span className="text-green-800">
                                                        {['ก', 'ข', 'ค', 'ง'][q.a]}. {q.options[q.a]}
                                                    </span>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [gameState, setGameState] = useState('menu');
            const [currentQuestions, setCurrentQuestions] = useState([]);
            const [finalAnswers, setFinalAnswers] = useState({});
            const [mode, setMode] = useState('');

            const startExam = (selectedMode) => {
                setMode(selectedMode);
                let qSet = [];
                
                if (selectedMode === 'exam') {
                    // Randomize & Slice
                    const shuffled = [...QUESTION_POOL].sort(() => 0.5 - Math.random());
                    qSet = shuffled.slice(0, EXAM_CONFIG.totalQuestionsInExam);
                } else {
                    // Practice: All questions
                    qSet = QUESTION_POOL;
                }

                setCurrentQuestions(qSet);
                setGameState('exam');
                window.scrollTo(0, 0);
            };

            const finishExam = (answers, isTimeOut) => {
                setFinalAnswers(answers);
                setGameState('result');
                if (isTimeOut) alert("หมดเวลาการสอบ!");
                window.scrollTo(0, 0);
            };

            if (gameState === 'menu') return <MenuScreen onStart={startExam} />;
            if (gameState === 'exam') return <ExamInterface mode={mode} questions={currentQuestions} onFinish={finishExam} onHome={() => setGameState('menu')} />;
            if (gameState === 'result') return <ResultScreen questions={currentQuestions} userAnswers={finalAnswers} onRestart={() => setGameState('menu')} />;
            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
